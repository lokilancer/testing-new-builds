<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14795b">
<meta name="description" content="Clear, visual practical lessons for Grades 6-11 in Sinhala, Tamil and English, with virtual labs for teachers.">
<script>try{var d=document.documentElement,l=localStorage.getItem("ll-lang");if(l)d.lang=l;if(localStorage.getItem("ll-theme")==="dark")d.dataset.theme="dark";var z=localStorage.getItem("ll-zoom");if(z)d.style.setProperty("--scale",z)}catch(e){}</script>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="logo.svg">
<title>Lab Guide LK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Lab Guide LK"><img src="logo.svg" alt="" width="42" height="42"><span><b id="appName">Lab Guide LK</b><small id="appTag"></small></span></a>
  <nav class="langs" role="group" aria-label="Language">
    <button data-lang="si" lang="si">සිංහල</button><button data-lang="ta" lang="ta">தமிழ்</button><button data-lang="en" lang="en">English</button>
  </nav>
  <div class="tools">
    <button id="zoomBtn" class="ibtn" aria-label="Text size">A+</button>
    <button id="themeBtn" class="ibtn" aria-label="Day or night theme"><span id="themeTxt">☾</span></button>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<div id="pbar" hidden>
  <button class="btn ghost" id="pPrev"></button><span id="pLabel"></span><button class="btn" id="pNext"></button><button class="btn ghost" id="pExit"></button>
</div>
<footer class="foot" id="foot"></footer>
<noscript><p style="padding:20px">This site needs JavaScript. / මෙම අඩවියට JavaScript අවශ්‍යයි. / இந்தத் தளத்துக்கு JavaScript தேவை.</p></noscript>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="data/refs.js"></script>
<script src="js/sims.js"></script>
<script src="js/app.js"></script>
</body>
</html>
